<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#059669">
  <meta name="description" content="2-11 sinflar uchun tezkor davomat va Kundalik.com yordamchisi">
  <title>Davomat Pro — O'qituvchi Yordamchisi</title>
  
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./style.css">
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>

<div class="app-container">
  <!-- TOP HEADER -->
  <header class="app-header">
    <div class="header-top">
      <div class="brand">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
          <polyline points="10 9 9 9 8 9"></polyline>
        </svg>
        <span>Davomat Pro</span>
      </div>
      <div class="header-actions">
        <button class="lang-btn active" id="langUzBtn">🇺🇿 UZ</button>
        <button class="lang-btn" id="langRuBtn">🇷🇺 RU</button>
      </div>
    </div>

    <!-- DATE BAR -->
    <div class="date-selector-bar">
      <span>📅</span>
      <input type="date" id="attendanceDate">
      <button class="quick-date-btn" id="btnYesterday">Kecha</button>
      <button class="quick-date-btn active" id="btnToday">Bugun</button>
    </div>
  </header>

  <!-- CLASS HORIZONTAL PILLS -->
  <div class="class-scroll-container" id="classPills">
    <!-- Rendered dynamically -->
  </div>

  <!-- MAIN DYNAMIC CONTENT -->
  <main class="main-content" id="mainContentArea">
    <!-- Active tab rendered by JS -->
  </main>

  <!-- BOTTOM NAVIGATION BAR -->
  <nav class="bottom-nav">
    <button class="nav-item active" data-tab="attendance">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 11l3 3L22 4"></path>
        <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
      </svg>
      <span>Davomat</span>
    </button>
    <button class="nav-item" data-tab="kundalik">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
      </svg>
      <span>Kundalik.com</span>
    </button>
    <button class="nav-item" data-tab="classes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
        <circle cx="9" cy="7" r="4"></circle>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
      </svg>
      <span>Sinflar</span>
    </button>
    <button class="nav-item" data-tab="stats">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="20" x2="18" y2="10"></line>
        <line x1="12" y1="20" x2="12" y2="4"></line>
        <line x1="6" y1="20" x2="6" y2="14"></line>
      </svg>
      <span>Arxiv & Excel</span>
    </button>
  </nav>
</div>

<!-- MODAL: ADD CLASS -->
<div class="modal-backdrop" id="addClassModal">
  <div class="modal-card">
    <div class="modal-header">
      <h3>Yangi Sinf Qo'shish</h3>
      <button class="modal-close-btn modal-close-trigger">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>Sinf nomi (Masalan: 2-A, 5-B, 5-V, 8-G, 11-A):</label>
        <input type="text" class="form-control" id="newClassNameInput" placeholder="5-B">
        <div class="form-hint">Istalgan 2-dan 11-gacha bo'lgan sinf va harfni kiriting.</div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary modal-close-trigger">Bekor qilish</button>
      <button class="btn-primary" id="saveClassBtn">Saqlash</button>
    </div>
  </div>
</div>

<!-- MODAL: ADD STUDENTS -->
<div class="modal-backdrop" id="addStudentModal">
  <div class="modal-card">
    <div class="modal-header">
      <h3>O'quvchilarni Qo'shish</h3>
      <button class="modal-close-btn modal-close-trigger">✕</button>
    </div>
    <div class="modal-body">
      <div style="display:flex; gap:8px; margin-bottom:14px;">
        <button class="btn-secondary active" id="tabBulkAdd" style="flex:1;">📋 Ro'yxatdan nusxalash</button>
        <button class="btn-secondary" id="tabSingleAdd" style="flex:1;">👤 Bittalab</button>
      </div>

      <div id="bulkAddSection">
        <div class="form-group">
          <label>O'quvchilar ro'yxatini tashlang (Telegram, Word, Exceldan):</label>
          <textarea class="form-control" id="bulkStudentsInput" placeholder="1. Aliyev Ali&#10;2. Karimova Madina&#10;3. Valiyev Sardor"></textarea>
          <div class="form-hint">Raqamlangan ro'yxat bo'lsa ham avtomatik tozalanib qo'shiladi.</div>
        </div>
      </div>

      <div id="singleAddSection" style="display:none;">
        <div class="form-group">
          <label>O'quvchi F.I.SH:</label>
          <input type="text" class="form-control" id="singleStudentNameInput" placeholder="Aliyev Ali">
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary modal-close-trigger">Bekor qilish</button>
      <button class="btn-primary" id="saveStudentsBtn">Qo'shish</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast-container" id="toastNotification">Muvaffaqiyatli saqlandi!</div>

<script src="./app.js"></script>
</body>
</html>
